<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Campus Marketplace — DSU{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="/">Campus Marketplace</a>
    <nav id="nav">
      <a href="/">Browse</a>
      <a href="/new">Sell an item</a>
      <span id="auth-links"></span>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <p>Built for Dakota State University students. A class project rebuild — no real money changes hands here.</p>
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
